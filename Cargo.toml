[package]
name = "markspace"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
walkdir = "2.5.0"

# Phase 5 size optimization: chase the PRD's 8–10 MB stretch target.
[profile.release]
opt-level = "z"   # optimize for size over speed
lto = true        # link-time optimization across crates
strip = true      # strip symbols from the binary
codegen-units = 1 # fewer units = better optimization (slower compile)
panic = "abort"   # drop unwinding machinery

[dev-dependencies]
tempfile = "3.27.0"
